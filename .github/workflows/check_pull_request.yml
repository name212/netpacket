name: Check pull request
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  tests:
    name: "Lint and tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Run test action
      uses: name212/action-dynamic-uses@81dc7108cd5145a4faec93ec0df1c643e34cbf79 # v4
      with:
        uses: 'dir:makefile-go/.github/actions/test'
        checkout_ref: ${{ github.event.pull_request.head.sha }}
        with: |
          tests_parallelism: "false"